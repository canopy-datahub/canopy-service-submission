# DEFAULT
spring:
  mvc:
    log-request-details: false
    log-resolved-exception: false
  jpa:
    hibernate.ddl-auto: none
    show-sql: false
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CANOPY_KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${CANOPY_KEYCLOAK_JWK_SET_URI}

server:
  port: 8083
  servlet:
    context-path: /api/submission/v1
  # request size bigger because headers
  max-file-size-MB: 1024
  max-request-size-MB: 1025

s3-bucket:
  in-review: ${InReviewS3Bucket}
  approved: ${ApprovedS3Bucket}
  sftp-ingest: ${SFTPIngestBucket}
  upload-portal: ${UploadPortalBucket}

s3:
  download-directory: "workingDirectory/"

radx:
  pii-queue: ${PiiQueue}
  supportEmail: ${supportEmail}
  emailQueue: ${EmailQueue}
  stakeholder-emails-study-reg: ${StakeholderEmailsStudyReg}
  host-url: ${HostURL}
  opensearch-lambda: ${OpensearchRefreshLambda}

management:
  endpoint:
    health:
      enabled: true
      show-details: never
    shutdown:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,shutdown

logging:
  level:
    root: warn
    org.canopyplatform.canopy.submissionservice:
      SubmissionServiceApplication: info
    org.springframework.web.servlet:
      DispatcherServlet: trace
      mvc.method.annotation:
        HttpEntityMethodProcessor: trace

keycloak:
  realm: ${CANOPY_KEYCLOAK_REALM}
  resource: ${CANOPY_KEYCLOAK_CLIENT_ID}

---
# LOCAL

spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
  datasource:
    url: jdbc:postgresql://${db_host:localhost}:${db_port:5432}/${db_name:canopy_local}
    username: ${db_username:canopy}
    password: ${db_password:canopy}

management:
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "[%boldMagenta(SUBMISSION)] [%boldGreen(LOCAL)] %d{yyyy-MM-dd HH:mm:ss.SSS} %highlight([%5p]) --- [%cyan(%15.15t)] %-40.40logger{1.} %boldYellow(::) %m%n%wEx"
---
# DEV

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  security:
    user:
      name: ${CANOPY_SPRING_MANAGEMENT_USER}
      password: ${CANOPY_SPRING_MANAGEMENT_PASSWORD}

management:
  endpoint:
    health:
      show-details: always


logging:
  level:
      root: warn
      org.canopyplatform.canopy.submissionservice:
        SubmissionServiceApplication: info
      org.springframework.web.servlet:
        DispatcherServlet: warn
        mvc.method.annotation:
          HttpEntityMethodProcessor: warn

  pattern:
    console: "[SUBMISSION] [DEV] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"

---
# TEST

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: test

logging:
  pattern:
    console: "[SUBMISSION] [TEST] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"
---
# PROD

spring:
  config:
    import: aws-secretsmanager:${AWS_SECRET_NAME}
    activate:
      on-profile: prod

logging:
  pattern:
    console: "[SUBMISSION] [PROD] %d{yyyy-MM-dd HH:mm:ss.SSS} [%5p] --- [%15.15t] %-40.40logger{1.} :: %m%n%wEx"
